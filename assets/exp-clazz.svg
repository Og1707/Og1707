<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="394" viewBox="0 0 1000 394" role="img" aria-label="AI Agents Team Lead en Clazz Digital" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect x=".5" y=".5" width="999" height="393" rx="16" fill="#0f172a" stroke="#1e293b"/><rect x="32" y="0" width="64" height="3" rx="1.5" fill="#8b5cf6"/><text x="32" y="48" font-size="21" font-weight="700" fill="#e2e8f0">AI Agents Team Lead</text><text x="32" y="72" font-size="14" font-weight="600" fill="#8b5cf6">Clazz Digital<tspan fill="#94a3b8" font-weight="400">  ·  Remoto, Colombia</tspan></text><rect x="797" y="28" width="171" height="28" rx="14" fill="#0b1220" stroke="#1e293b"/><text x="882.5" y="46.5" text-anchor="middle" font-size="12" font-weight="600" fill="#8b5cf6">Jun 2025 – Ene 2026</text><line x1="32" y1="92" x2="968" y2="92" stroke="#1e293b"/><rect x="32" y="113" width="6" height="6" rx="1.5" fill="#8b5cf6"/><text xml:space="preserve" x="52" y="122" font-size="14" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="700">Liderazgo técnico:</tspan> dirigí la fase de desarrollo del backend para agentes de IA con Python y JavaScript, apoyado</text><text xml:space="preserve" x="52" y="143" font-size="14" fill="#94a3b8">en herramientas no-code/low-code para acelerar la entrega.</text><rect x="32" y="167" width="6" height="6" rx="1.5" fill="#8b5cf6"/><text xml:space="preserve" x="52" y="176" font-size="14" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="700">Integración de LLMs:</tspan> conecté agentes con las principales APIs (GPT-4, Claude y otras), ampliando la</text><text xml:space="preserve" x="52" y="197" font-size="14" fill="#94a3b8">automatización a los casos de uso de cada cliente.</text><rect x="32" y="221" width="6" height="6" rx="1.5" fill="#8b5cf6"/><text xml:space="preserve" x="52" y="230" font-size="14" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="700">Operación en producción:</tspan> supervisión proactiva del rendimiento del agente: latencia, tasa de errores y consumo</text><text xml:space="preserve" x="52" y="251" font-size="14" fill="#94a3b8">de recursos para sostener la fiabilidad.</text><rect x="32" y="275" width="6" height="6" rx="1.5" fill="#8b5cf6"/><text xml:space="preserve" x="52" y="284" font-size="14" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="700">Mejora continua:</tspan> actualización constante en IA, LLMs y tendencias de automatización, incorporadas a las</text><text xml:space="preserve" x="52" y="305" font-size="14" fill="#94a3b8">decisiones de arquitectura.</text><rect x="32" y="348" width="70" height="26" rx="13" fill="#0b1220" stroke="#1e293b"/><text x="67.0" y="365.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Python</text><rect x="110" y="348" width="100" height="26" rx="13" fill="#0b1220" stroke="#1e293b"/><text x="160.0" y="365.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">JavaScript</text><rect x="218" y="348" width="63" height="26" rx="13" fill="#0b1220" stroke="#1e293b"/><text x="249.5" y="365.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">GPT-4</text><rect x="289" y="348" width="70" height="26" rx="13" fill="#0b1220" stroke="#1e293b"/><text x="324.0" y="365.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Claude</text><rect x="367" y="348" width="159" height="26" rx="13" fill="#0b1220" stroke="#1e293b"/><text x="446.5" y="365.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">No-code / Low-code</text></svg>