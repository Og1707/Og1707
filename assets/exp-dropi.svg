<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="AI Automation &amp; QA Engineer — CRM Systems en Dropi S.A.S." font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect x=".5" y=".5" width="999" height="339" rx="16" fill="#0f172a" stroke="#1e293b"/><rect x="32" y="0" width="64" height="3" rx="1.5" fill="#22d3ee"/><text x="32" y="48" font-size="21" font-weight="700" fill="#e2e8f0">AI Automation &amp; QA Engineer — CRM Systems</text><text x="32" y="72" font-size="14" font-weight="600" fill="#22d3ee">Dropi S.A.S.<tspan fill="#94a3b8" font-weight="400">  ·  Remoto</tspan></text><rect x="797" y="28" width="171" height="28" rx="14" fill="#0b1220" stroke="#1e293b"/><text x="882.5" y="46.5" text-anchor="middle" font-size="12" font-weight="600" fill="#22d3ee">Feb 2026 – Presente</text><line x1="32" y1="92" x2="968" y2="92" stroke="#1e293b"/><rect x="32" y="113" width="6" height="6" rx="1.5" fill="#22d3ee"/><text xml:space="preserve" x="52" y="122" font-size="14" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="700">Arquitectura de IA en LATAM:</tspan> automatización de la atención al cliente en Colombia, México, Chile, Perú, Ecuador,</text><text xml:space="preserve" x="52" y="143" font-size="14" fill="#94a3b8">Panamá y República Dominicana mediante backend e integraciones de IA (LLMs + n8n).</text><rect x="32" y="167" width="6" height="6" rx="1.5" fill="#22d3ee"/><text xml:space="preserve" x="52" y="176" font-size="14" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="700">Ingeniería de datos:</tspan> modelado en PostgreSQL para analítica de negocio; menores tiempos de consulta en Metabase</text><text